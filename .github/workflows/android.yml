
name: Build Parsa Calculator

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Build Android APK
        run: |
          mkdir -p "$HOME/.buildozer"
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            ghcr.io/kivy/buildozer:latest android debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ParsaCalculator-APK
          path: bin/*.apk
